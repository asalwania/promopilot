name: promopilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promopilot}
      POSTGRES_DB: ${POSTGRES_DB:-promopilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # `make demo` (the `demo` profile, ADR 0073): before the api starts, generate and load the
  # seed-42 world and train the models into the volume, skipping what is already done.
  init:
    profiles: [demo]
    build: ./backend
    command: ["python", "-m", "promopilot.demo"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-promopilot}:${POSTGRES_PASSWORD:-promopilot}@postgres:5432/${POSTGRES_DB:-promopilot}
      MODEL_DIR: models
    volumes:
      - model-artifacts:/app/models
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-promopilot}:${POSTGRES_PASSWORD:-promopilot}@postgres:5432/${POSTGRES_DB:-promopilot}
      # `make up` always replays the cassettes baked into the image (ADR 0022). `make demo` sets
      # STACK_LLM_PROVIDER=auto: live when .env holds a key, else replay (ADR 0073).
      LLM_PROVIDER: ${STACK_LLM_PROVIDER:-replay}
      LLM_CASSETTE_DIR: cassettes
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # Trained model artifacts; train inside the container so the api sees them (ADR 0023).
      MODEL_DIR: models
      # The recorded full eval run baked into the image, so /evals is never empty (ADR 0073).
      EVAL_REPORT_DIR: evals/published
    volumes:
      - model-artifacts:/app/models
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # Only in the demo profile; `make up` has no init step (ADR 0073).
      init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  model-artifacts:
