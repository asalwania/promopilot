name: promopilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promopilot}
      POSTGRES_DB: ${POSTGRES_DB:-promopilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-promopilot}:${POSTGRES_PASSWORD:-promopilot}@postgres:5432/${POSTGRES_DB:-promopilot}
      # Always the cassettes baked into the image: the stack never needs or reads an API key.
      LLM_PROVIDER: replay
      LLM_CASSETTE_DIR: cassettes
      # Trained model artifacts; train inside the container so the api sees them (ADR 0023).
      MODEL_DIR: models
    volumes:
      - model-artifacts:/app/models
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  model-artifacts:
