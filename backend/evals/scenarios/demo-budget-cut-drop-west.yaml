# The demo brief (SPEC §3.2), amended twice and its relaxation accepted, as the demo session is
# (ADR 0054, ADR 0070). Revision 3 misses SKU0006's 60% target by a fraction of a point; accepting
# its relaxation re-plans a feasible revision 4, which the manager can approve (ADR 0076).
name: demo-budget-cut-drop-west
group: mid_plan_amendments
brief: >-
  Plan Diwali promotions for Snacks and Beverages across North and West. Budget ₹8 lakh. Keep
  margin above 18%. We are overstocked on 400g namkeen packs — clear at least 60% of that stock.
  Target families.
as_of_week: 104
seed: 0
amendments:
  - "Budget cut to ₹6 lakh"
  - "Drop West"
  - accept_relaxation: true
labels:                         # as stated; the accepted relaxation is applied when scored
  regions: [North]
  categories: [Snacks, Beverages]
  marketing_budget: 600000
  min_margin: 0.18
  clearance_targets:
    - {sku_id: SKU0002, sell_through: 0.6}
    - {sku_id: SKU0006, sell_through: 0.6}
expect:
  - declares_infeasible: false  # approvable (ADR 0046 D10)
  - excludes_region: West
  - meets_clearance: SKU0002
  - meets_clearance: SKU0006    # against the relaxed target the final request holds
  - diff_changes: clearance_targets
