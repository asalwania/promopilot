name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term
      - name: Coverage gate (core packages, line coverage >= 85%, SPEC §6)
        run: uv run coverage json -q -o coverage.json && uv run python -m tools.coverage_gate coverage.json

  backend-integration:
    name: Backend integration (testcontainers Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -m integration

  eval-smoke:
    name: Eval smoke (5 scenarios, replay, no key)
    runs-on: ubuntu-latest
    # Four model fits (35-60 s each) and six planning rounds (150-250 s each), ADR 0069.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      # The seed-42 world is generated and fitted in memory: no Docker, `make data` or
      # `make train`. A run with no plan, a broken constraint or expected property, a vague or
      # infeasible scenario handled wrongly, or any cassette miss fails the job (exit 3).
      - name: Replay the smoke scenarios and check the report
        env:
          LLM_PROVIDER: replay
        run: uv run python -m promopilot.evals --smoke --check
      - name: Add the report to the job summary
        if: always()
        run: if [ -f evals/reports/latest.md ]; then cat evals/reports/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-smoke-report
          path: backend/evals/reports/
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contract:
    name: API contract (generated types and docs up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd backend && uv sync --locked
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: make api-types
      - name: Fail if OpenAPI or generated types are stale
        run: git diff --exit-code -- docs/openapi.json frontend/src/lib/api/schema.d.ts
      # `make api-types` also rewrote docs/api.md from the contract (ADR 0082).
      - name: Fail if the API docs are stale
        run: |
          if ! git diff --exit-code -- docs/api.md; then
            echo "::error file=docs/api.md::docs/api.md is out of date with the API contract: run make api-types and commit docs/api.md"
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard -- docs/api.md)" ]; then
            echo "::error file=docs/api.md::docs/api.md is not committed: run make api-types and commit it"
            exit 1
          fi
      # ...and docs/tools.md from the tool registry (ADR 0088).
      - name: Fail if the tool docs are stale
        run: |
          if ! git diff --exit-code -- docs/tools.md; then
            echo "::error file=docs/tools.md::docs/tools.md is out of date with the tool registry: run make tool-docs and commit docs/tools.md"
            exit 1
          fi

  demo:
    name: make demo from a clean checkout (no key, Playwright)
    runs-on: ubuntu-latest
    # A cold build, data and models (about 5 min), every recorded session replayed (about
    # 3 min) and the Playwright journeys (about 5 min), ADR 0073.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # What a judge runs on a fresh clone: build, seed-42 data, trained models, the app.
      - name: make demo (first start)
        timeout-minutes: 20
        run: make demo
      - name: The stack replays with no key, is healthy and serves the recorded eval report
        run: |
          curl -fsS http://localhost:8000/health | python3 -c "import json, sys; health = json.load(sys.stdin); print(health); assert health['status'] == 'ok' and health['llm']['mode'] == 'replay'"
          curl -fsS -o /dev/null http://localhost:8000/api/evals/latest
      # Every scripted session plays through the full agent graph on the cassettes alone
      # (ADR 0054): a cassette miss or a fallback fails here, naming the request.
      - name: Replay every recorded session with no key
        timeout-minutes: 15
        run: docker compose exec -T api python -m promopilot.cassettes --check
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm exec playwright install --with-deps chromium
      - run: cd frontend && pnpm test:e2e
      # The deck screenshot set (#78): every key screen at 1920x1080, from the recorded
      # example briefs only (no key). The script fails if a screen is missing from the set.
      - name: Capture the deck screenshots
        timeout-minutes: 15
        run: cd frontend && pnpm screenshots
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deck-screenshots
          path: frontend/screenshots/
          retention-days: 30
          if-no-files-found: warn
      # A later start reuses the data and models: the init step skips both.
      - name: make demo again (restart)
        timeout-minutes: 5
        run: |
          make demo | tee restart.log
          grep -q "already loaded: skipped" restart.log
          grep -q "already trained: skipped" restart.log
      - if: failure()
        run: docker compose --profile demo logs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
      - if: always()
        run: make demo-reset
